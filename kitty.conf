# Font
# font_family FiraCode Nerd Font Mono
font_size 18

# Rendering tweaks (good defaults)
adjust_line_height 0
adjust_column_width 0

# Transparency
background_opacity 0.85
map ctrl+l clear_terminal reset active


# BEGIN_KITTY_FONTS
font_family      family='Adwaita Mono' style=Regular features='+lnum +zero'
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

shell /bin/fish
